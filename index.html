<!DOCTYPE html>
<html lang="pt-PT">
<head>
<link rel="apple-touch-icon" href="icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Enviar dinheiro</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--bar:#383838;--ink:#EDEDED;--mut:#9B9B9B;--line:#8A8A8A;--div:#2E2E2E;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:300;font-size:17px}
.app{max-width:440px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
header{background:var(--bar);padding:env(safe-area-inset-top,0px) 0 0;flex:none}
.hb{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 14px}
.hb h1{margin:0;font-size:18px;font-weight:400;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.ib{width:32px;height:32px;display:grid;place-items:center;background:none;border:0;color:#fff;padding:0;cursor:pointer}
.help{visibility:hidden}.help svg{display:block}
.help.on{visibility:visible}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:0 20px;overflow-y:auto;overflow-x:hidden;background:var(--bg)}
@keyframes inF{from{transform:translateX(100%)}to{transform:none}}
@keyframes outF{from{transform:none}to{transform:translateX(-22%)}}
@keyframes inB{from{transform:translateX(-22%)}to{transform:none}}
@keyframes outB{from{transform:none}to{transform:translateX(100%)}}
.anim-in-f,.anim-out-b{z-index:2}
.anim-in-f{animation:inF .36s cubic-bezier(.32,.72,0,1) both}
.anim-out-f{z-index:1;animation:outF .36s cubic-bezier(.32,.72,0,1) both}
.anim-in-b{z-index:1;animation:inB .36s cubic-bezier(.32,.72,0,1) both}
.anim-out-b{animation:outB .36s cubic-bezier(.32,.72,0,1) both}
.scr.on{display:flex}
button:focus-visible,select:focus-visible{outline:2px solid #8FB0FF;outline-offset:3px}
input:focus,input:focus-visible{outline:none}
.ul:focus,.search:focus-within,.cs:focus-within .vis{border-bottom-color:#459FE3}
.ul{width:100%;background:none;border:0;border-bottom:1.5px solid var(--line);border-radius:0;color:var(--ink);font:inherit;font-size:20px;padding:8px 0;caret-color:#fff}
.ul::placeholder{color:#777}
.search{display:flex;align-items:center;gap:20px;border-bottom:1.5px solid var(--line);margin-top:36px;padding-bottom:4px}
.search input{flex:1;background:none;border:0;color:var(--ink);font:inherit;font-size:22px;padding:8px 0}
.search input::placeholder{color:#777}
.new{display:flex;align-items:center;gap:36px;margin:28px 0 0;background:none;border:0;color:var(--ink);font:500 21px 'Barlow',sans-serif;padding:0;cursor:pointer;text-align:left}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:#C3C6CC;color:#fff;display:grid;place-items:center;font:300 20px 'Barlow',sans-serif}
.new .av{background:#555}
h2{font-size:19px;font-weight:300;margin:46px 0 14px}
.ct{display:flex;align-items:center;gap:30px;padding:10px 0;background:none;border:0;width:100%;color:var(--ink);text-align:left;cursor:pointer;font-family:inherit}
.ct .t{flex:1;min-width:0}
.ct .t b{display:block;font-weight:500;font-size:21px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct .t span{display:block;font-size:18px}
.mbl{width:40px;height:20px;flex:none;display:block}
.fl{width:22px;height:15px;border-radius:2px;display:block;flex:none}
.lab{font-size:17px;color:#D0D0D0;margin:26px 0 6px}
.nc{display:flex;gap:30px;align-items:flex-end}
.cs{position:relative;width:101px;flex:none}
.cs .vis{display:flex;align-items:center;gap:10px;border-bottom:1.5px solid var(--line);padding:6px 0;font-size:22px;font-weight:300}
.cs .vis em{font-style:normal;font-size:20px}
.cs select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.nc .num{flex:1;min-width:0}
.bot{margin-top:auto;padding:20px 0 calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:20px}
.pill{display:flex;align-items:center;justify-content:center;gap:10px;background:#232323;border-radius:10px;height:50px;width:71.2%;min-width:223px;padding:0;font-size:16px;font-weight:300;cursor:pointer;white-space:nowrap}
.pill input{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border:1.5px solid #C9C9C9;border-radius:2px;background:none;position:relative;flex:none;cursor:pointer}
.pill input:checked{background:#2ED573;border-color:#2ED573}
.pill input:checked::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg)}
.btn{width:76.6%;min-width:240px;height:45px;border-radius:5px;border:2px solid #3A3A3A;background:var(--bar);color:#fff;font:600 21px 'Barlow',sans-serif;letter-spacing:.2px;cursor:pointer;text-transform:uppercase}
.btn:disabled{background:none;color:#5B5B5B;cursor:default}
.amtl{text-align:center;margin-top:46px;font-size:21px;font-weight:300}
.amt{position:relative;display:flex;justify-content:center;align-items:baseline;gap:12px;margin-top:30px;font-size:70px;font-weight:400;line-height:1.1}
.adisp{position:relative;display:inline-block;border-bottom:1.5px solid #CFCFCF;padding:0 6px;white-space:pre}
.adisp:focus-within{border-bottom-color:#459FE3}
.adisp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;background:none;padding:0}
.spin{position:absolute;inset:0;z-index:5;display:none;place-items:center}
.spin.on{display:grid}
.spin i{width:44px;height:44px;border-radius:50%;border:5px solid transparent;border-top-color:#fff;border-right-color:#fff;animation:sp .85s linear infinite,spPulse .65s ease-in-out infinite alternate;will-change:transform}
@keyframes sp{to{rotate:360deg}}
@keyframes spPulse{from{scale:.86}to{scale:1.08}}
.car{position:relative;display:inline-block;width:0;height:1em;vertical-align:baseline}
.car::after{content:"";position:absolute;left:-1px;top:.27em;width:2px;height:.76em;background:#fff;border-radius:2px;animation:caretPulse .42s ease-in-out infinite alternate;will-change:opacity}
.adisp:not(:focus-within) .car{display:none}
@keyframes caretPulse{from{opacity:1}to{opacity:.28}}
.aw{color:var(--ink)}.ag{color:#6B6B6B}
.desc{padding:0 12px;margin-top:44px}
.desc label{font-size:21px;display:block;margin-bottom:6px}
.card{margin:22px auto 0;width:236px;border-radius:14px;padding:24px 12px 22px;text-align:center;background:linear-gradient(135deg,#585858 0%,#303030 38%,#222 100%);box-shadow:0 2px 10px #0006}
.card .v{font-size:44px;font-weight:600;line-height:1}
.card .p{display:flex;align-items:center;gap:10px;margin:10px 0 14px;font-size:16px;font-weight:500;color:#fff}
.card .p::before,.card .p::after{content:"";flex:1;height:2px;background:#8FA3B8}
.card .n{font-size:19px;font-weight:600;color:#fff;line-height:1.15}
.card .nm{font-size:16px;font-weight:400;color:#DDD;margin-bottom:2px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 4px;border-bottom:1px solid var(--div);font-size:21px}
.rw span:first-child{color:#9B9B9B}
.rw .r{text-align:right;display:flex;align-items:center;gap:12px;color:#E4E4E4}
.rw .r small{font-size:20px;font-weight:300}
.mc{flex:none;width:42px;height:27px;border-radius:3px;background:#FFD400;position:relative;color:#7A5B00;font:800 17px/27px 'Barlow',sans-serif;text-align:center}
.mc u{position:absolute;right:3px;bottom:1px;font:italic 800 7px/1 'Barlow',sans-serif;color:#10207A;text-decoration:none}
.gif{text-align:center;margin:auto 0 10px;padding-top:30px;background:none;border:0;color:var(--ink);font:300 22px 'Barlow',sans-serif;cursor:pointer}
.gif svg{display:block;margin:0 auto 10px}
.ok{width:84px;height:84px;border-radius:50%;border:3px solid #fff;margin:44px auto 20px;display:grid;place-items:center}
.msg{text-align:center;font-size:26px;font-weight:500;margin:0 0 6px}
.sub{text-align:center;color:var(--mut);margin:14px 24px 0;font-size:16px}

.mbl{width:40px;height:auto;flex:none;display:block}
.mc{background:none;overflow:hidden}.mc img{display:block;width:100%;height:100%}
#s5{padding-top:0}
.fly{display:block;width:calc((100% + 40px) * .4937);margin:28.6dvh 0 0 calc((100% + 40px) * .268 - 20px);overflow:visible}
.sent{text-align:center;margin-top:calc(9.9dvh - 14px);opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.sent h3{margin:0;font:600 18.5px/1.3 'Barlow',sans-serif;color:var(--ink)}
.sent p{margin:10px 0 0;font-size:16px;font-weight:300;color:#CFCFCF}
#s5 .bot{padding-bottom:max(6.8dvh,env(safe-area-inset-bottom,0px));gap:2.9dvh}
.banner{display:block;width:76.6%;min-width:240px;height:auto;opacity:0;transform:translateY(8px);transition:opacity .4s .1s,transform .4s .1s}
.sent.in,.banner.in{opacity:1;transform:none}
#s5 .btn{border-color:var(--bar)}

/* v4: tipografia calibrada pelas capturas + PIN */
.btn{font-size:16px;letter-spacing:.3px}
.amtl{margin-top:40px;font-size:16px;line-height:20px}
.amt{margin-top:23px;font-size:41px;line-height:45px;gap:8px}
.adisp{padding:0 0 2px 3px;border-bottom-width:1px}
.desc{width:67.7%;margin:41px auto 0;padding:0}
.desc label{font-size:16px;line-height:20px;margin-bottom:6px}
#desc{font-size:16.5px!important;padding:6px 0 5px}
.card{margin-top:8px;width:231px;padding:37px 10px 23px}
.card .v{font-size:41px;line-height:41px}
.card .p{margin:14px 0 22px;font-size:14px;line-height:16px}
.card .n{font-size:20px;line-height:22px}
.card .nm{font-size:15px;line-height:18px;margin-bottom:2px}
#s4 .card + div{margin-top:35px!important;padding:0 8px}
.rw{height:50px;padding:0;font-size:14px}
.rw .r small{font-size:13px}
.gif{margin:auto 0 45px;padding-top:0;font-size:14px;line-height:18px}
.gif svg{width:23px;height:20px;margin:0 auto 12px}
header.clear{background:var(--bg)}
#s6{align-items:center;padding:0}
.pinlogo{display:block;width:85.5px;height:auto;margin-top:calc(16.2dvh - 48px - env(safe-area-inset-top,0px))}
.pint{margin:48px 0 0;font:500 17px/24px 'Barlow',sans-serif;color:#E0E0E0;text-align:center}
.dots{display:flex;gap:10px;margin-top:27px}
.dots i{width:20px;height:20px;border-radius:50%;border:1.7px solid #BEC3C9;background:transparent;transition:background .12s,border-color .12s}
.dots i.f{background:#7CC300;border-color:#7CC300}
.forg{margin:24px 0 0;text-align:center;font:300 15px/20px 'Barlow',sans-serif;color:#A0A0A0}
.forg a{color:#4A90E2;text-decoration:underline;font-weight:300}
.pad{margin-top:auto;width:100%;display:grid;grid-template-columns:repeat(3,1fr);padding:0 10px max(5.3dvh,calc(env(safe-area-inset-bottom,0px) + 8px))}
.k{height:78px;background:none;border:0;display:grid;place-items:center;padding:0;color:#E0E0E0;font:500 25px 'Barlow',sans-serif;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.k b{display:grid;place-items:center;width:84%;height:58px;border-radius:7px;font-weight:500;transition:background .18s}
.k.on b{background:#363636;transition:none}
.k.e{visibility:hidden}
.k:focus-visible{outline:2px solid #8FB0FF;outline-offset:-4px}
.desc{margin-top:39px}
#desc{padding:6px 0 3px}
.bot{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.card{padding-top:35px}
#s4 .bot{margin-top:0}
.gif{margin:auto 0 43px}
.pint{font:500 16.5px/24px 'Barlow',sans-serif;margin-top:46px}
.forg{font:400 14px/20px 'Barlow',sans-serif}
.forg a{font-weight:400}
.k{font-size:26px;font-weight:600}.k b{font-weight:600}
.dots i{border-width:2px;border-color:#C4C9CE}
.card{padding-left:16px;padding-right:16px}
.k svg{width:36px;height:21px}
</style>
</head>
<body>
<div class="app">
<header><div class="hb">
  <button class="ib" id="back" aria-label="Voltar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg></button>
  <h1 id="title">Enviar para</h1>
  <button class="ib help" id="help" aria-label="Ajuda"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10.6"/><path d="M8.9 9.4c0-1.8 1.4-3 3.1-3s3.1 1.1 3.1 2.8c0 2.2-2.6 2.3-2.6 4.5" stroke-width="1.6"/><circle cx="12.5" cy="17.6" r=".6" fill="#fff" stroke-width="1"/></svg></button>
</div></header>

<main class="stage">
<section class="scr on" id="s1">
  <div class="search">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5.5 5.5"/></svg>
    <input id="q" type="text" placeholder="Pesquisar contacto" autocomplete="off">
  </div>
  <button class="new" id="newc"><span class="av"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="9.5" r="4.6"/><path d="M3 23.5v-1c0-3.8 3.3-6.5 8-6.5s8 2.7 8 6.5v1z"/><path d="M22.5 6v7M19 9.5h7"/></svg></span>Novo contacto</button>
  <div id="lists"></div>
</section>

<section class="scr" id="s2">
  <div class="nc">
    <div>
      <div class="lab" style="margin-top:36px">País/Região</div>
      <div class="cs">
        <div class="vis"><span id="flag"></span><span id="code">+351</span><svg style="margin-left:auto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4 8 8 8 8-8"/></svg></div>
        <select id="country" aria-label="País/Região"></select>
      </div>
    </div>
    <div class="num">
      <div class="lab" style="margin-top:36px">Número de telemóvel</div>
      <input class="ul" id="num" type="tel" inputmode="numeric" autocomplete="off" aria-label="Número de telemóvel">
    </div>
  </div>
  <div class="lab" style="margin-top:54px">Nome (opcional)</div>
  <input class="ul" id="name" type="text" autocomplete="off" aria-label="Nome (opcional)" style="margin-top:10px">
  <div class="bot">
    <label class="pill"><input type="checkbox" id="save">Guardar nos meus contactos</label>
    <button class="btn" id="b2" disabled>Continuar</button>
  </div>
</section>

<section class="scr" id="s3">
  <div class="amtl">Valor a enviar</div>
  <div class="amt"><label class="adisp"><span class="aw" id="aw"></span><span class="car"></span><span class="ag" id="ag">0,00</span><input id="amt" type="text" inputmode="decimal" autocomplete="off" aria-label="Valor a enviar"></label><span>€</span></div>
  <div class="desc"><label for="desc">Descrição</label><input class="ul" id="desc" type="text" maxlength="40" placeholder="Ex: Semanada" autocomplete="off" style="font-size:22px"></div>
  <div class="bot"><button class="btn" id="b3" disabled>Continuar</button></div>
</section>

    <div class="rw"><span>Custo</span><span class="r">Isento</span></div>
    <div class="rw" id="rdr" style="display:none"><span>Descrição</span><span class="r" id="rd"></span></div>
  </div>
  <button class="gif" type="button"><svg width="48" height="44" viewBox="0 0 48 44" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="3" width="42" height="38" rx="6"/><circle cx="14" cy="13" r="3"/><path d="m6 34 12-11 8 7 7-8 9 10"/></svg>Adicionar GIF</button>
  <div class="bot" style="padding-top:10px"><button class="btn" id="b4">Enviar dinheiro</button></div>

function show(n,dir){

function renderAmt(){
  var t=txt,w,g;

}

};
